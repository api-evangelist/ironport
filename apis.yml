name: Ironport
description: >-
  IronPort Systems was an email and web security gateway company founded in 2000
  in San Bruno, California, known for its anti-spam, anti-virus, anti-phishing,
  and URL-filtering appliances and its SenderBase email reputation service. Cisco
  Systems acquired IronPort in 2007 for approximately $830 million; the products
  were rebranded as Cisco Email Security and Cisco Web Security and the standalone
  IronPort brand and pricelist were fully retired by late 2012. IronPort no longer
  operates an independent public website, developer portal, or API surface — its
  domain now resolves into Cisco — so this profile is retained as a historical
  Menlo Ventures portfolio company rather than an active API provider awaiting
  enrichment.
